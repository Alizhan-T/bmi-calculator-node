<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="BMI Calculator — Node.js and Express 5 Web App and JSON API">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="80%" cy="35%" r="48%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="22%" cy="82%" r="42%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="whoSpectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="30%" stop-color="#22C55E"/>
      <stop offset="65%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F87171"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowBlue)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowGreen)"/>

  <!-- Top WHO Spectrum Accent Line -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#whoSpectrum)"/>

  <!-- Pill Badge -->
  <g transform="translate(64, 54)">
    <rect x="0" y="0" width="232" height="30" rx="15" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="15" r="4.5" fill="#22C55E"/>
    <text x="30" y="19.5" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.4">NODE.JS · EXPRESS 5 · REST API</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="64" y="142" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="50" font-weight="800" letter-spacing="-1.2">BMI Calculator</text>
  <text x="64" y="180" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="19" font-weight="400">WHO-standard Body Mass Index web app &amp; validated JSON API</text>

  <!-- Feature Pills -->
  <g transform="translate(64, 214)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600">
    <rect x="0" y="0" width="144" height="34" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="72" y="21.5" text-anchor="middle" fill="#38BDF8">m &amp; cm Units</text>

    <rect x="156" y="0" width="166" height="34" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="239" y="21.5" text-anchor="middle" fill="#4ADE80">WHO Scale Gauge</text>

    <rect x="334" y="0" width="154" height="34" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="411" y="21.5" text-anchor="middle" fill="#93C5FD">POST /api/bmi</text>

    <rect x="500" y="0" width="146" height="34" rx="10" fill="#1E293B" stroke="#334155"/>
    <text x="573" y="21.5" text-anchor="middle" fill="#FDBA74">14 node:test</text>
  </g>

  <!-- Right-side Glass Metric Gauge Card -->
  <g transform="translate(808, 48)">
    <rect x="0" y="0" width="328" height="224" rx="18" fill="#0F172A" fill-opacity="0.86" stroke="#334155" stroke-width="1.2"/>
    <text x="24" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="0.8">LIVE WHO CLASSIFICATION</text>
    <rect x="234" y="18" width="70" height="22" rx="11" fill="#14532D" stroke="#22C55E" stroke-opacity="0.5"/>
    <text x="269" y="33" text-anchor="middle" fill="#86EFAC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11.5" font-weight="700">200 OK</text>

    <text x="24" y="102" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">22.72</text>
    <text x="172" y="84" fill="#4ADE80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="700">Normal weight</text>
    <text x="172" y="104" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12.5">72 kg · 1.78 m</text>

    <!-- 4-segment WHO Scale -->
    <g transform="translate(24, 134)">
      <rect x="0" y="0" width="66" height="10" rx="5" fill="#38BDF8"/>
      <rect x="70" y="0" width="66" height="10" rx="3" fill="#22C55E"/>
      <rect x="140" y="0" width="52" height="10" rx="3" fill="#FB923C"/>
      <rect x="196" y="0" width="84" height="10" rx="5" fill="#F87171"/>
      <circle cx="108" cy="5" r="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="3"/>
      <text x="0" y="26" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">12</text>
      <text x="58" y="26" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">18.5</text>
      <text x="132" y="26" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">25</text>
      <text x="188" y="26" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">30</text>
      <text x="256" y="26" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">40+</text>
    </g>

    <!-- Healthy Range Footer -->
    <rect x="24" y="176" width="280" height="30" rx="8" fill="#1E293B"/>
    <text x="164" y="195.5" text-anchor="middle" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12">Healthy range: 58.6 kg – 78.9 kg</text>
  </g>
</svg>
